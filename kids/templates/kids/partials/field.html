{% if field.field.widget.input_type == "checkbox" %}
<div class="field field--full">
  <label class="checkbox-line" for="{{ field.id_for_label }}">
    {{ field }}
    <span>{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}
      {% if field.help_text %}<span class="hint">{{ field.help_text }}</span>{% endif %}
    </span>
  </label>
  {% for error in field.errors %}<p class="error-text">{{ error }}</p>{% endfor %}
</div>
{% else %}
<div class="field {{ extra_class }}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="hint" id="{{ field.id_for_label }}_helptext">{{ field.help_text|safe }}</p>{% endif %}
  {% for error in field.errors %}<p class="error-text">{{ error }}</p>{% endfor %}
</div>
{% endif %}
